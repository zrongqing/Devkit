server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    access_log /var/log/nginx/access.log;
    error_log /var/log/nginx/error.log warn;

    # Resolve Docker service names at request time, so the gateway can start before the APIs.
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $identity_upstream "${DEVKIT_IDENTITY_UPSTREAM}";
    set $business_upstream "${DEVKIT_BUSINESS_UPSTREAM}";
    set $filestorage_upstream "${DEVKIT_FILESTORAGE_UPSTREAM}";

    location ~ ^/api/v1/(auth|identity|web|client/navigation)(/|$) {
        proxy_pass http://$identity_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location ~ ^/api/v1/(files|storage)(/|$) {
        proxy_pass http://$filestorage_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        client_max_body_size 25m;
        proxy_read_timeout 900s;
    }

    location /api/ {
        proxy_pass http://$business_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        client_max_body_size 25m;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
