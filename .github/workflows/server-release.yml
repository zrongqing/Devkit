name: Release Devkit Server

on:
  push:
    tags:
      - "server-v*"

permissions:
  contents: read
  packages: write

concurrency:
  group: server-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Test and publish server image
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Set up .NET SDK
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json

      - name: Validate release tag
        shell: bash
        run: |
          set -euo pipefail

          if [[ ! "$GITHUB_REF_NAME" =~ ^server-v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z]+([.-][0-9A-Za-z]+)*)?$ ]]; then
            echo "Release tag '$GITHUB_REF_NAME' must use the format server-v1.2.3 or server-v1.2.3-rc.1."
            exit 1
          fi

          version="${GITHUB_REF_NAME#server-v}"
          source_version="$(sed -n 's:.*<VersionPrefix>\(.*\)</VersionPrefix>.*:\1:p' src/server/Directory.Build.props)"
          if [[ "$source_version" != "$version" ]]; then
            echo "Release tag version '$version' does not match VersionPrefix '$source_version'."
            exit 1
          fi

          git fetch origin main:refs/remotes/origin/main
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main || {
            echo "Release tag '$GITHUB_REF_NAME' must point to a commit contained in main."
            exit 1
          }

          owner="${GITHUB_REPOSITORY_OWNER,,}"
          echo "RELEASE_VERSION=$version" >> "$GITHUB_ENV"
          echo "SERVER_IMAGE=ghcr.io/$owner/devkit-server" >> "$GITHUB_ENV"

      - name: Restore server
        run: dotnet restore src/server/Devkit.Server.slnx --nologo

      - name: Build server
        run: dotnet build src/server/Devkit.Server.slnx --configuration Release --no-restore --nologo -p:Version="$RELEASE_VERSION"

      - name: Test server
        run: dotnet test src/server/Devkit.Server.slnx --configuration Release --no-build --no-restore --nologo -p:Version="$RELEASE_VERSION"

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - name: Build and push image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: src/server/src/Devkit.Server.Api/Dockerfile
          push: true
          build-args: |
            VERSION=${{ env.RELEASE_VERSION }}
          tags: |
            ${{ env.SERVER_IMAGE }}:${{ env.RELEASE_VERSION }}
            ${{ env.SERVER_IMAGE }}:sha-${{ github.sha }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ env.RELEASE_VERSION }}
          cache-from: type=gha,scope=server
          cache-to: type=gha,mode=max,scope=server
          provenance: true
          sbom: true
