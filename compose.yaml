name: devkit

services:
  nginx:
    image: nginx:stable-alpine
    restart: unless-stopped
    ports:
      - "${DEVKIT_WEB_HOST_IP:-127.0.0.1}:${DEVKIT_WEB_HOST_PORT:-8081}:80"
    environment:
      DEVKIT_IDENTITY_UPSTREAM: devkit-identity:8080
      DEVKIT_BUSINESS_UPSTREAM: devkit-server:8080
      DEVKIT_FILESTORAGE_UPSTREAM: devkit-files:8080
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/"]
      interval: 15s
      timeout: 3s
      retries: 3
    volumes:
      - type: bind
        source: ./web/dist
        target: /usr/share/nginx/html
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ./web/nginx.conf
        target: /etc/nginx/templates/default.conf.template
        read_only: true
      - type: volume
        source: nginx-logs
        target: /var/log/nginx
        volume:
          nocopy: true

  devkit-server:
    image: ${DEVKIT_BUSINESS_IMAGE:-devkit-business:local}
    build:
      context: .
      dockerfile: server/src/Business/Devkit.Business.Api/Dockerfile
      args:
        VERSION: ${DEVKIT_BUSINESS_VERSION:-0.1.0}
    ports:
      - "127.0.0.1:${DEVKIT_SERVER_HOST_PORT:-8080}:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ConnectionStrings__Business: ${DEVKIT_BUSINESS_SQL_CONNECTION_STRING:-}
      Jwt__Issuer: ${DEVKIT_JWT_ISSUER:-Devkit.Server}
      Jwt__Audience: ${DEVKIT_JWT_AUDIENCE:-Devkit.Clients}
      Jwt__ValidationPublicKeyPath: /run/keys/business-public.pem
      Identity__BaseUrl: http://devkit-identity:8080
      # Plain HTTP is confined to this private Compose network; use HTTPS across hosts.
      Identity__RequireHttps: "false"
      Workspace__QdrantUrl: http://qdrant:6333
      FileService__BaseUrl: http://devkit-files:8080
      FileService__RequireHttps: "false"
      FileService__ApiKey: ${DEVKIT_FILE_SERVICE_API_KEY:-}
    depends_on:
      devkit-identity:
        condition: service_healthy
      devkit-files:
        condition: service_healthy
      qdrant:
        condition: service_started
    volumes:
      - type: bind
        source: ${DEVKIT_JWT_PUBLIC_KEY_FILE:-D:/.server data/devkit/keys/business-public.pem}
        target: /run/keys/business-public.pem
        read_only: true
        bind:
          create_host_path: false
    extra_hosts:
      - "host.docker.internal:host-gateway"

  devkit-files:
    image: ${DEVKIT_FILESTORAGE_IMAGE:-devkit-filestorage:local}
    build:
      context: .
      dockerfile: server/src/FileStorage/Devkit.FileStorage.Api/Dockerfile
      args:
        VERSION: ${DEVKIT_FILESTORAGE_VERSION:-0.1.0}
    ports:
      - "127.0.0.1:${DEVKIT_FILESTORAGE_HOST_PORT:-8083}:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ConnectionStrings__FileStorage: ${DEVKIT_FILESTORAGE_SQL_CONNECTION_STRING:-}
      Jwt__Issuer: ${DEVKIT_JWT_ISSUER:-Devkit.Server}
      Jwt__Audience: ${DEVKIT_JWT_AUDIENCE:-Devkit.Clients}
      Jwt__ValidationPublicKeyPath: /run/keys/business-public.pem
      Identity__BaseUrl: http://devkit-identity:8080
      # Plain HTTP is confined to this private Compose network; use HTTPS across hosts.
      Identity__RequireHttps: "false"
      FileStorage__DataRoot: /var/lib/devkit
      FileStorage__Clients__Business__ApiKey: ${DEVKIT_FILE_SERVICE_API_KEY:-}
    depends_on:
      devkit-identity:
        condition: service_healthy
    volumes:
      - type: bind
        source: ${DEVKIT_DATA_ROOT:-D:/.server data/devkit}
        target: /var/lib/devkit
        bind:
          create_host_path: false
      - type: bind
        source: ${DEVKIT_JWT_PUBLIC_KEY_FILE:-D:/.server data/devkit/keys/business-public.pem}
        target: /run/keys/business-public.pem
        read_only: true
        bind:
          create_host_path: false
    extra_hosts:
      - "host.docker.internal:host-gateway"

  devkit-identity:
    image: ${DEVKIT_IDENTITY_IMAGE:-devkit-identity:local}
    build:
      context: .
      dockerfile: server/src/Identity/Devkit.Identity.Api/Dockerfile
      args:
        VERSION: ${DEVKIT_IDENTITY_VERSION:-0.1.0}
    restart: unless-stopped
    ports:
      - "127.0.0.1:${DEVKIT_IDENTITY_HOST_PORT:-8082}:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ConnectionStrings__Identity: ${DEVKIT_IDENTITY_SQL_CONNECTION_STRING:-}
      Jwt__Issuer: ${DEVKIT_JWT_ISSUER:-Devkit.Server}
      Jwt__Audience: ${DEVKIT_JWT_AUDIENCE:-Devkit.Clients}
      Jwt__SigningPrivateKeyPath: /run/keys/identity-private.pem
      Redis__ConnectionString: redis:6379,abortConnect=false
      Registration__Enabled: ${DEVKIT_REGISTRATION_ENABLED:-false}
      BootstrapAccount__Enabled: ${DEVKIT_BOOTSTRAP_ENABLED:-false}
      BootstrapAccount__UserName: ${DEVKIT_BOOTSTRAP_USER_NAME:-}
      BootstrapAccount__Email: ${DEVKIT_BOOTSTRAP_EMAIL:-}
      BootstrapAccount__Password: ${DEVKIT_BOOTSTRAP_PASSWORD:-}
    depends_on:
      redis:
        condition: service_healthy
    volumes:
      - type: bind
        source: ${DEVKIT_JWT_PRIVATE_KEY_FILE:-D:/.server data/devkit/keys/identity-private.pem}
        target: /run/keys/identity-private.pem
        read_only: true
        bind:
          create_host_path: false
    extra_hosts:
      - "host.docker.internal:host-gateway"

  redis:
    image: ${DEVKIT_REDIS_IMAGE:-redis:latest}
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "127.0.0.1:${DEVKIT_REDIS_HOST_PORT:-6379}:6379"
    volumes:
      - type: bind
        source: ${DEVKIT_DOCKER_DATA_ROOT:-D:/.docker data}/redis
        target: /data
        bind:
          create_host_path: false
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  qdrant:
    image: ${DEVKIT_QDRANT_IMAGE:-qdrant/qdrant:latest}
    restart: unless-stopped
    ports:
      - "127.0.0.1:${DEVKIT_QDRANT_HTTP_PORT:-6333}:6333"
      - "127.0.0.1:${DEVKIT_QDRANT_GRPC_PORT:-6334}:6334"
    environment:
      QDRANT__TELEMETRY_DISABLED: "true"
    volumes:
      - qdrant-data:/qdrant/storage
      - qdrant-snapshots:/qdrant/snapshots
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  nginx-logs:
    name: devkit_nginx-logs
  # Keep Qdrant on Docker's Linux filesystem; Windows bind mounts are unsafe for it.
  qdrant-data:
    name: devkit_qdrant-data
  qdrant-snapshots:
    name: devkit_qdrant-snapshots
