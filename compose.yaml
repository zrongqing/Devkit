services:
  devkit-server:
    image: ${DEVKIT_SERVER_IMAGE:-devkit-server:local}
    build:
      context: .
      dockerfile: server/src/Devkit.Server.Api/Dockerfile
      args:
        VERSION: ${DEVKIT_SERVER_VERSION:-0.1.0}
    ports:
      - "127.0.0.1:${DEVKIT_SERVER_HOST_PORT:-8080}:8080"
    environment:
      ASPNETCORE_URLS: http://+:8080
      ASPNETCORE_ENVIRONMENT: Production
      ConnectionStrings__Default: ${DEVKIT_SQL_CONNECTION_STRING:-}
      Jwt__Issuer: ${DEVKIT_JWT_ISSUER:-Devkit.Server}
      Jwt__Audience: ${DEVKIT_JWT_AUDIENCE:-Devkit.Clients}
      Jwt__SigningKey: ${DEVKIT_JWT_SIGNING_KEY:-}
      Redis__ConnectionString: redis:6379,abortConnect=false
      Workspace__DataRoot: /var/lib/devkit
      Workspace__QdrantUrl: http://qdrant:6333
      Registration__Enabled: ${DEVKIT_REGISTRATION_ENABLED:-false}
      BootstrapAccount__Enabled: ${DEVKIT_BOOTSTRAP_ENABLED:-false}
      BootstrapAccount__UserName: ${DEVKIT_BOOTSTRAP_USER_NAME:-}
      BootstrapAccount__Email: ${DEVKIT_BOOTSTRAP_EMAIL:-}
      BootstrapAccount__Password: ${DEVKIT_BOOTSTRAP_PASSWORD:-}
    depends_on:
      redis:
        condition: service_healthy
      qdrant:
        condition: service_started
    volumes:
      - type: bind
        source: ${DEVKIT_DATA_ROOT:-D:/.server data/devkit}
        target: /var/lib/devkit
        bind:
          create_host_path: false
    extra_hosts:
      - "host.docker.internal:host-gateway"

  redis:
    image: redis:8.0
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "127.0.0.1:${DEVKIT_REDIS_HOST_PORT:-6379}:6379"
    volumes:
      - type: bind
        source: ${DEVKIT_DOCKER_DATA_ROOT:-D:/.docker data}/redis
        target: /data
        bind:
          create_host_path: false
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  qdrant:
    image: qdrant/qdrant:v1.19.1
    restart: unless-stopped
    ports:
      - "127.0.0.1:${DEVKIT_QDRANT_HTTP_PORT:-6333}:6333"
      - "127.0.0.1:${DEVKIT_QDRANT_GRPC_PORT:-6334}:6334"
    environment:
      QDRANT__TELEMETRY_DISABLED: "true"
    volumes:
      - qdrant-data:/qdrant/storage
      - qdrant-snapshots:/qdrant/snapshots
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  # Keep Qdrant on Docker's Linux filesystem; Windows bind mounts are unsafe for it.
  qdrant-data:
    name: devkit_qdrant-data
  qdrant-snapshots:
    name: devkit_qdrant-snapshots
